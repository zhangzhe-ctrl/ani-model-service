# PostgreSQL/S3 credential Secrets and the CA ConfigMap are pre-existing.
replicaCount: 1

# Helm waits for this Job before installing or upgrading the Deployment.
# Applied files are recorded in public.schema_migrations and skipped later.
migration:
  enabled: true
  image:
    repository: docker.changqingyun.cn/library/postgres
    tag: 16-alpine
  imagePullPolicy: IfNotPresent
  imagePullSecrets: []
  backoffLimit: 1
  ttlSecondsAfterFinished: 3600
  hookDeletePolicy: before-hook-creation,hook-succeeded
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi
image:
  repository: docker.changqingyun.cn/ani/model-service
  tag: master-acb24c2-20261016
  pullPolicy: IfNotPresent
  pullSecrets: []
tls:
  existingSecret: ani-model-server-tls
  caKey: ca.crt
  certKey: tls.crt
  keyKey: tls.key
  certificate:
    create: true
    dnsName: ani-model.ani.internal
    # 10 years. The server reads this key pair once at startup.
    duration: 87600h
    renewBefore: 720h
    issuer:
      name: ani-internal
      kind: ClusterIssuer
      group: cert-manager.io
database:
  existingSecret: ani-model-database
  secretKey: dsn
# The binary currently exposes the direct S3-compatible adapter through
# ANI_MINIO_* environment names; chart values use storage terminology.
storage:
  mode: direct # direct or grpc
  direct:
    # Set this for the target cluster. Leaving it empty prevents accidentally
    # connecting a new release to an older environment.
    endpoint: ""
    secure: false
    bucket: ani-models
    tenantBuckets: false
    existingSecret: ani-model-minio
    accessKeyKey: ANI_MINIO_ACCESS_KEY
    secretKeyKey: ANI_MINIO_SECRET_KEY
  grpc:
    address: ""
    serverName: ""
    caCertSecret: ""
    caCertKey: ca.crt
import:
  jobImage:
    repository: docker.changqingyun.cn/ani/model-import-worker
    tag: master-37fe220-20261015
  # Empty uses the cluster default StorageClass.
  storageClass: ""
  providerSecret: ""
  modelscopeBaseURL: ""
  huggingfaceBaseURL: ""
inference:
  # Empty on purpose. Setting an address without mTLS certificates makes the
  # process exit. Model startup does not require Inference.
  grpcAddress: ""
  # Tenant scope comes from a verified caller certificate and metadata.
  serverName: ""
  tls:
    existingSecret: model-inference-mtls
    mountPath: /var/run/ani-inference-tls
    caKey: ca.crt
    certKey: tls.crt
    keyKey: tls.key
    certificate:
      create: true
      dnsName: ani-model.ani.internal
      # 10 years. The client reads this key pair once at startup.
      duration: 87600h
      renewBefore: 720h
caBundle:
  enabled: false
  existingConfigMap: ani-model-public-ca
  key: ca-certificates.crt
podSecurityContext:
  runAsUser: 65532
  runAsGroup: 65532
  runAsNonRoot: true
resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: "1"
    memory: 1Gi
nodeSelector: {}
tolerations: []
affinity: {}
probes:
  readiness:
    initialDelaySeconds: 5
    periodSeconds: 5
    timeoutSeconds: 3
    failureThreshold: 12
  liveness:
    initialDelaySeconds: 15
    periodSeconds: 10
    timeoutSeconds: 3
